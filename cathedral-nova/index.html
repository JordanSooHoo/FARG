<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cathedral Nova</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* layout: one framed canvas (the "nave") centred, a keyboard legend beneath it */
:root{
  --void:#05030d; --ink:#e9e4ff; --dim:#8f86b8; --gold:#ffd23f; --rose:#ff4fd8; --line:#2a1f4d;
  --display:"Cinzel Decorative","Times New Roman",serif;
  --hud:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#c{display:block;width:100%;max-width:min(1300px,calc((100vh - 84px) * 1.4222));aspect-ratio:1024/720;height:auto;border-radius:6px;
  box-shadow:0 0 0 1px var(--line),0 0 60px rgba(255,79,216,.13);outline:none;background:#000}
#c:focus-visible{box-shadow:0 0 0 2px var(--gold),0 0 60px rgba(255,210,63,.2)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:12px;color:var(--dim);max-width:1100px;letter-spacing:.02em}
.legend span{white-space:nowrap}
kbd{font-family:var(--hud);font-weight:600;font-size:11px;color:var(--ink);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#120c26}
</style>

</head>
<body>
<canvas id="c" width="1024" height="720" tabindex="0" aria-label="Cathedral Nova game screen. Keyboard only."></canvas>
<div class="legend" aria-label="Controls">
  <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> / <kbd>WASD</kbd> fly</span>
  <span><kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd> or <kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> fire bass · tenor · treble on the note</span>
  <span><kbd>Shift</kbd> shield</span>
  <span><kbd>Space</kbd> Cannon in D</span>
  <span><kbd>F</kbd> Fermata (classical)</span>
  <span><kbd>Esc</kbd> pause</span>
</div>
<input type="file" id="file" accept="audio/*,.mp3,.ogg,.wav,.m4a,.flac" hidden>

<script>
'use strict';
// ================================================================ setup
const W=1024,H=720,PF=700;
const cv=document.getElementById('c'), g=cv.getContext('2d');
(function(){const d=Math.min(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);})();
const HUD='"Chakra Petch","Segoe UI",system-ui,sans-serif', DISP='"Cinzel Decorative","Times New Roman",serif';
const font=(w,s,f=HUD)=>`${w} ${s}px ${f}`;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
try{document.fonts.load('700 20px "Chakra Petch"');document.fonts.load('900 40px "Cinzel Decorative"');}catch(e){}
const store={get(k,d){try{const v=localStorage.getItem('cnova_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('cnova_'+k,JSON.stringify(v));}catch(e){}}};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const LANES=[
  {name:'BASS',keys:'Z · J',col:'#ff5a6e',hi:'#ffc8d0'},
  {name:'TENOR',keys:'X · K',col:'#3dffb0',hi:'#c8ffe9'},
  {name:'TREBLE',keys:'C · L',col:'#5fb8ff',hi:'#d6edff'}];
const LANE_KEYS={KeyZ:0,KeyJ:0,KeyX:1,KeyK:1,KeyC:2,KeyL:2};
const GENRES={
  organ:{label:'Pipe Organ',cath:true,col:'#ffd23f',perk:'Sustain beams on long notes, two-key chords, extra pipes ("stops") at 25 / 50 / 100 combo, and a stronger Cannon in D.'},
  orchestral:{label:'Orchestral',cath:true,col:'#ff8a3d',perk:'Orchestra sections join as wingmen at 20 / 40 / 60 combo and fire on every beat.'},
  classical:{label:'Classical',cath:true,col:'#c792ff',perk:'Maestro timing widens the hit windows. F casts a Fermata that slows enemy fire for 4 beats.'},
  synthwave:{label:'Synthwave',col:'#ff4fd8'}, dnb:{label:'Drum & Bass',col:'#3df5ff'},
  electronic:{label:'Electronic',col:'#3df5ff'}, rock:{label:'Rock',col:'#ff5a6e'}, hiphop:{label:'Hip-hop',col:'#ffd23f'},
  pop:{label:'Pop',col:'#ff9de2'}, other:{label:'Other',col:'#9aa0ff'}};
const CATH_PERK='Cathedral Mode: stained-glass sky, ×1.25 score, Cannon in D charges 50% faster.';
const PICK_GENRES=['organ','orchestral','classical','electronic','rock','hiphop','pop','other'];
const DIFF=[
  {name:'Easy',win:[.065,.105,.155],gap:.36,fire:.35,bspd:150,ehp:.8,lead:1.9,shoot:1},
  {name:'Normal',win:[.05,.085,.13],gap:.2,fire:.6,bspd:200,ehp:1,lead:1.6,shoot:2},
  {name:'Hard',win:[.04,.07,.11],gap:.11,fire:.9,bspd:250,ehp:1.25,lead:1.35,shoot:3}];
const settings={diff:store.get('diff',1),offset:store.get('offset',0),speed:store.get('speed',1)};

// ================================================================ audio engine
let AC=null, master=null, sfxBus=null, NOISE=null;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.8;
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
  master.connect(comp); comp.connect(AC.destination);
  sfxBus=AC.createGain(); sfxBus.gain.value=.35; sfxBus.connect(master);
}
function noiseBuf(){ if(NOISE) return NOISE; const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return NOISE=b; }
function makeIR(sec,decay){ const len=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);} return b; }
let lastCT=-1,lastPerf=0;
function audioNow(){ const ct=AC.currentTime,p=performance.now(); if(ct!==lastCT){lastCT=ct;lastPerf=p;} return ct+Math.min(.04,(p-lastPerf)/1000); }
const mtof=m=>440*Math.pow(2,(m-69)/12);
function osc(type,f,t,end,dest,det=0){ const o=AC.createOscillator(); o.type=type; o.frequency.value=f; o.detune.value=det; o.connect(dest); o.start(t); o.stop(end); return o; }
function filt(type,f,q,dest){ const b=AC.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q||.7; b.connect(dest); return b; }
function noise(t,dur,dest){ const n=AC.createBufferSource(); n.buffer=noiseBuf(); n.connect(dest); n.start(t,Math.random()*.8); n.stop(t+dur); return n; }
function vo(t,dur,a,r,peak,bus,rev){ const gn=AC.createGain(),p=gn.gain,hold=t+Math.max(a+.005,dur);
  p.setValueAtTime(0,t); p.linearRampToValueAtTime(peak,t+a); p.setValueAtTime(peak,hold); p.linearRampToValueAtTime(0,hold+r);
  gn.connect(bus); if(rev&&G&&G.revIn) gn.connect(G.revIn); return [gn,hold+r+.03]; }
function decay(t,peak,len,bus,rev){ const gn=AC.createGain(); gn.gain.setValueAtTime(peak,t); gn.gain.exponentialRampToValueAtTime(.0008,t+len);
  gn.connect(bus); if(rev&&G&&G.revIn) gn.connect(G.revIn); return gn; }
const INST={
  organ(t,m,d,v,bus){ const f=mtof(m), [gn,end]=vo(t,d,.018,.14,v*.11,bus,1);
    const parts=m<45?[[1,1],[2,.55],[3,.2],[4,.25]]:[[.5,.35],[1,1],[2,.55],[3,.16],[4,.3],[8,.1]];
    for(const [h,a] of parts){ const fr=f*h; if(fr>9000) continue; const og=AC.createGain(); og.gain.value=a; og.connect(gn); osc('sine',fr,t,end,og); }
    const ch=decay(t,v*.03,.05,gn); noise(t,.06,filt('bandpass',f*4,2,ch)); },
  strings(t,m,d,v,bus){ const f=mtof(m), [gn,end]=vo(t,d,.07,.3,v*.075,bus,1), lp=filt('lowpass',Math.min(5000,f*6),.7,gn);
    osc('sawtooth',f,t,end,lp,-7); osc('sawtooth',f,t,end,lp,7); },
  brass(t,m,d,v,bus){ const f=mtof(m), [gn,end]=vo(t,d,.035,.15,v*.075,bus,1), lp=filt('lowpass',f,1.2,gn);
    lp.frequency.setValueAtTime(f*1.2,t); lp.frequency.linearRampToValueAtTime(Math.min(6000,f*7),t+.08); lp.frequency.linearRampToValueAtTime(f*4,t+.4);
    osc('sawtooth',f,t,end,lp); osc('sawtooth',f,t,end,lp,5); },
  pizz(t,m,d,v,bus){ const gn=decay(t,v*.22,.38,bus,1); osc('triangle',mtof(m),t,t+.42,gn); },
  flute(t,m,d,v,bus){ const f=mtof(m), [gn,end]=vo(t,d,.06,.15,v*.12,bus,1); const o=osc('sine',f,t,end,gn);
    const g2=AC.createGain(); g2.gain.value=.12; g2.connect(gn); osc('triangle',f*2,t,end,g2);
    const l=AC.createOscillator(), lg=AC.createGain(); l.frequency.value=5; lg.gain.value=f*.006; l.connect(lg); lg.connect(o.frequency); l.start(t+.15); l.stop(end); },
  lead(t,m,d,v,bus){ const f=mtof(m), [gn,end]=vo(t,d,.01,.12,v*.055,bus,1), lp=filt('lowpass',3200,3,gn);
    const o1=osc('square',f,t,end,lp), o2=osc('sawtooth',f,t,end,lp,9);
    const l=AC.createOscillator(), lg=AC.createGain(); l.frequency.value=5.5; lg.gain.value=14; l.connect(lg); lg.connect(o1.detune); lg.connect(o2.detune); l.start(t+.18); l.stop(end); },
  pluck(t,m,d,v,bus){ const f=mtof(m), gn=decay(t,v*.12,.28,bus,1), lp=filt('lowpass',4000,2,gn);
    lp.frequency.setValueAtTime(4200,t); lp.frequency.exponentialRampToValueAtTime(300,t+.22); osc('sawtooth',f,t,t+.3,lp); },
  pad(t,m,d,v,bus){ const f=mtof(m), [gn,end]=vo(t,d,.35,.6,v*.03,bus,1), lp=filt('lowpass',1500,.7,gn);
    for(const dt of [-12,0,12]) osc('sawtooth',f,t,end,lp,dt); },
  sbass(t,m,d,v,bus){ const f=mtof(m), [gn,end]=vo(t,d,.005,.06,v*.12,bus,0), lp=filt('lowpass',800,4,gn);
    lp.frequency.setValueAtTime(1800,t); lp.frequency.exponentialRampToValueAtTime(450,t+.15); osc('sawtooth',f,t,end,lp); osc('square',f/2,t,end,lp); },
  reese(t,m,d,v,bus){ const f=mtof(m), [gn,end]=vo(t,d,.02,.1,v*.1,bus,0), lp=filt('lowpass',600,1,gn);
    osc('sawtooth',f,t,end,lp,-18); osc('sawtooth',f,t,end,lp,18); osc('sine',f/2,t,end,gn); },
  bell(t,m,d,v,bus){ const f=mtof(m), gn=decay(t,v*.13,1.4,bus,1); osc('sine',f,t,t+1.5,gn);
    const g2=decay(t,.35,.6,gn); osc('sine',f*2.76,t,t+.7,g2); const g3=decay(t,.12,.25,gn); osc('sine',f*5.4,t,t+.3,g3); },
  timp(t,m,d,v,bus){ const f=mtof(m), gn=decay(t,v*.5,.9,bus,1); const o=osc('sine',f*1.06,t,t+1,gn); o.frequency.exponentialRampToValueAtTime(f,t+.1);
    const g2=decay(t,v*.3,.08,bus); noise(t,.1,filt('lowpass',600,1,g2)); },
  kick(t,m,d,v,bus){ const gn=decay(t,v*1.0,.4,bus); const o=osc('sine',160,t,t+.42,gn); o.frequency.exponentialRampToValueAtTime(42,t+.12); },
  snare(t,m,d,v,bus){ const gn=decay(t,v*.42,.18,bus); noise(t,.2,filt('highpass',900,.7,gn)); const g2=decay(t,v*.3,.08,bus); osc('triangle',200,t,t+.1,g2); },
  hat(t,m,d,v,bus){ const gn=decay(t,v*.13,.045,bus); noise(t,.06,filt('highpass',7500,.7,gn)); },
  crash(t,m,d,v,bus){ const gn=decay(t,v*.16,1.4,bus); noise(t,1.5,filt('highpass',3500,.7,gn)); },
};
// sound effects (independent of the song bus)
const SFX={
  blip(f=660){ if(!AC) return; const t=AC.currentTime, gn=decay(t,.35,.09,sfxBus); osc('square',f,t,t+.1,filt('lowpass',2500,1,gn)); },
  boom(big){ const t=AC.currentTime, gn=decay(t,big?.9:.35,big?.9:.25,sfxBus); noise(t,1,filt('lowpass',big?500:1100,1,gn)); },
  hurt(){ const t=AC.currentTime, gn=decay(t,.8,.5,sfxBus); const o=osc('sawtooth',180,t,t+.5,filt('lowpass',900,2,gn)); o.frequency.exponentialRampToValueAtTime(50,t+.4); },
  clam(){ const t=AC.currentTime, f=rand(140,220), gn=decay(t,.28,.16,sfxBus); osc('sawtooth',f,t,t+.18,gn); osc('sawtooth',f*1.06,t,t+.18,gn); },
  tutti(organ){ const t=AC.currentTime, gn=decay(t,.5,2.2,sfxBus); for(const m of (organ?[38,50,57,62,66,69,74,78,81,86]:[50,57,62,66,69,74])){ const og=AC.createGain(); og.gain.value=.12; og.connect(gn); osc('sine',mtof(m),t,t+2.3,og); osc('sine',mtof(m)*2,t,t+2.3,og); } },
  pick(){ const t=AC.currentTime, gn=decay(t,.3,.25,sfxBus); osc('sine',1320,t,t+.25,gn); osc('sine',1980,t+.06,t+.25,gn); },
};

// ================================================================ song building
const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nm(s){ const m=/^([A-G])(#|b)?(-?\d)$/.exec(s); if(!m) throw new Error('bad note '+s); return (parseInt(m[3],10)+1)*12+PC[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); }
function tempoFn(map){ return b=>{ let s=0; for(let i=0;i<map.length;i++){ const b0=map[i][0], b1=i+1<map.length?map[i+1][0]:Infinity; if(b<=b0) break; s+=(Math.min(b,b1)-b0)*60/map[i][1]; } return s; }; }
class SB{
  constructor(tm){ this.tm=tm; this.ev=[]; this.mel=[]; this.end=0; }
  add(inst,b,ms,d,vel=.7,mel=false){ ms=[].concat(ms); for(const m of ms) this.ev.push({b,inst,m,d,vel,mel}); if(mel) this.mel.push({b,ms,d}); this.end=Math.max(this.end,b+d); }
  seq(inst,str,b,o={}){ let d=1; for(const tok of str.trim().split(/\s+/)){ const [n,ds]=tok.split('/'); if(ds!==undefined) d=parseFloat(ds);
      if(n!=='r') this.add(inst,b,n.split('+').map(x=>nm(x)+(o.tr||0)),d*.95,o.vel??.7,!!o.mel); b+=d; } return b; }
  compile(meta){ const b2s=tempoFn(this.tm);
    const events=this.ev.map(e=>({t:b2s(e.b),dur:b2s(e.b+e.d)-b2s(e.b),inst:e.inst,m:e.m,vel:e.vel,mel:e.mel})).sort((a,b)=>a.t-b.t);
    const mel=this.mel.map(n=>({t:b2s(n.b),dur:b2s(n.b+n.d)-b2s(n.b),ms:n.ms})).sort((a,b)=>a.t-b.t);
    const beats=[]; for(let b=0;b<=Math.ceil(this.end);b++) beats.push(b2s(b));
    const sd={...meta,events,mel,beats,barOffset:0,duration:b2s(this.end)+2,bpm:this.tm[0][1]};
    sd.makeChart=(D,organ)=>chartFromMelody(sd.mel,D,organ); return sd; }
}
function fixHolds(notes){
  notes.sort((a,b)=>a.t-b.t||a.lane-b.lane);
  for(let i=0;i<notes.length;i++){ const n=notes[i]; if(!n.end) continue;
    for(let j=i+1;j<notes.length;j++){ const m=notes[j]; if(m.t>n.end+.2) break; if(m.lane===n.lane&&m.t>n.t){ n.end=Math.min(n.end,m.t-.16); break; } }
    if(n.end-n.t<.35) n.end=0; }
  return notes;
}
function chartFromMelody(mel,D,organ){
  const tops=mel.map(n=>Math.max(...n.ms)).sort((a,b)=>a-b);
  const t1=tops[Math.floor(tops.length*.33)], t2=tops[Math.floor(tops.length*.67)];
  const lane=p=>p<=t1?0:p<=t2?1:2;
  const notes=[]; let last=-9, cid=0;
  for(const n of mel){ if(n.t-last<D.gap) continue; last=n.t;
    const L=lane(Math.max(...n.ms)), end=organ&&n.dur>=.55?n.t+n.dur*.85:0, note={t:n.t,lane:L,end};
    notes.push(note);
    if(organ&&n.ms.length>=2){ const lo=lane(Math.min(...n.ms)); const L2=lo!==L?lo:(L===0?1:L-1); notes.push({t:n.t,lane:L2,end,chord:cid}); note.chord=cid++; }
  }
  return fixHolds(notes);
}

// ---- Toccata (pipe organ)
function buildToccata(){
  const s=new SB([[0,92]]); let b=0;
  const phrase=o=>`A${o}/.25 G${o} A${o}/1.5 r/.5 G${o}/.25 F${o} E${o} D${o} C#${o}/1 D${o}/2 r/1.5`;
  const dim='C#4/.25 E4 G4 Bb4 C#5 E5 G5 Bb5';
  for(const o of [5,4,3]){ s.seq('organ',phrase(o),b,{mel:true}); s.add('organ',b+4.5,[38],3,.55); b+=8; }
  s.add('organ',b,[26,38],7.5,.6); b=s.seq('organ',dim+' D4+F4+A4+D5/4 r/2',b,{mel:true});
  const runs=['A5/.25 G5 F5 E5 F5 E5 D5 C#5 D5 C#5 Bb4 A4 Bb4 A4 G4 F4','E4/.25 F4 G4 A4 Bb4 A4 G4 F4 E4 F4 G4 A4 C#5/1',
    'D5/.25 E5 F5 D5 G5 F5 E5 D5 A5 G5 F5 E5 D5/1','A4+D5+F5/2 A4+C#5+E5/2'], peds=[38,33,38,33];
  const doRuns=()=>{ runs.forEach((r,i)=>{ s.add('organ',b,[peds[i]-12,peds[i]],3.9,.5); b=s.seq('organ',r,b,{mel:true}); }); };
  doRuns(); doRuns();
  const fug=['A4/.5 D5 A4 E5 A4 F5 E5 D5','A4/.5 E5 A4 F5 A4 G5 F5 E5','A4/.5 F5 A4 G5 A4 A5 G5 F5','E5/.5 D5 C#5 E5 D5/2'];
  const ped=[['D3/1 C3 Bb2 A2','C#3/1 A2 D3 E3','F3/1 E3 D3 C#3','A2/2 D2/2'],['D3/1 F3 G3 A3','A2/1 C#3 D3 E3','D3/1 Bb2 G2 A2','A2/2 D2/2']];
  for(let rep=0;rep<2;rep++) fug.forEach((f,i)=>{ s.seq('organ',ped[rep][i],b,{vel:.5}); if(rep) s.seq('organ',f,b,{tr:-12,vel:.35}); b=s.seq('organ',f,b,{mel:true}); });
  doRuns();
  s.seq('organ',phrase(4),b,{vel:.45}); s.add('organ',b,[26],7.5,.6); b=s.seq('organ',phrase(5),b,{mel:true});
  s.add('organ',b,[26,38],8,.6); b=s.seq('organ',dim,b,{mel:true});
  s.add('organ',b,[26,38],6,.7); b=s.seq('organ','D4+F#4+A4+D5/6',b,{mel:true}); s.add('organ',b-6,[50,57],6,.5);
  return s.compile({title:'Toccata of the Void',by:'J.S. Bach · Toccata & Fugue in D minor, BWV 565',genre:'organ'});
}
// ---- Mountain King (orchestral, accelerating)
function buildMountain(){
  const s=new SB([[0,100],[36,118],[68,140],[100,168],[132,196]]);
  const A='A3/.5 B3 C4 D4 E4 C4 E4/1 D#4/.5 B3 D#4/1 D4/.5 A#3 D4/1 A3/.5 B3 C4 D4 E4 C4 E4 A4 G4 E4 C4 E4 G4/2';
  const B='E4/.5 F#4 G4 A4 B4 G4 B4/1 C5/.5 G#4 C5/1 B4/.5 G4 B4/1 E4/.5 F#4 G4 A4 B4 G4 B4 E5 D5 B4 G4 B4 D5/2';
  for(let b=0;b<4;b++) s.add('pizz',b,[b%2?40:45],.5,.6);
  const L=[[['pizz',0,1]],[['strings',0,1],['pizz',-12]],[['strings',12,1],['brass',0],['pizz',-12]],
    [['strings',12,1],['brass',0],['strings',0],['pizz',-12]],[['brass',12,1],['strings',12],['brass',0],['strings',-12]]];
  for(let k=0;k<5;k++){ const b0=4+32*k, vel=.55+k*.08;
    for(const [inst,tr,mel] of L[k]){ s.seq(inst,A,b0,{tr,mel:!!mel,vel}); s.seq(inst,B,b0+16,{tr,mel:!!mel,vel}); }

function buildOde(){
  const s=new SB([[0,108],[132,124]]);
  const P1='E5/1 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 E5/1.5 D5/.5 D5/2', P2='E5/1 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 D5/1.5 C5/.5 C5/2',
        P3='D5/1 D5 E5 C5 D5 E5/.5 F5 E5/1 C5 D5 E5/.5 F5 E5/1 D5 C5 D5 G4/2';
  const tune=[P1,P2,P3,P2], CH={C:[48,52,55],G:[43,47,50]}, bars='C G C G C G C C G C G G C G C C'.split(' ');
  const alberti=(bb,c,v)=>{ for(let i=0;i<8;i++) s.add('pizz',bb+i*.5,[CH[c][[0,2,1,2][i%4]]+12],.45,v); };
  alberti(0,'C',.5);
  for(let rep=0;rep<3;rep++){ const b0=4+rep*64; let b=b0;
    for(const p of tune){ s.seq(rep===0?'flute':'strings',p,b,{mel:true,vel:.6+rep*.12}); if(rep===2) s.seq('brass',p,b,{tr:-12,vel:.45}); b+=16; }
    for(let bar=0;bar<16;bar++){ const c=bars[bar], bb=b0+bar*4; alberti(bb,c,.45+rep*.08);
      s.add('pizz',bb,[CH[c][0]-12],1,.6);
      if(rep>=1){ s.add('brass',bb,CH[c].map(x=>x+12),3.8,.3); s.add('timp',bb,[CH[c][0]],.5,.6); }
      if(rep===2) s.add('timp',bb+2,[CH[c][0]],.5,.5); }
    if(rep===2) s.add('crash',b0,[0],1,.6);
  }
  s.seq('strings','C5+E5+G5+C6/2 G4+B4+D5+G5/2 C5+E5+G5+C6/4',196,{mel:true,vel:.9});
  s.seq('brass','C3+G3+C4/2 G2+D3+G3/2 C3+G3+C4/4',196,{vel:.7});
  s.add('timp',196,[48],.5,.9); s.add('timp',198,[43],.5,.9); s.add('timp',200,[48],.5,1); s.add('crash',200,[0],1,.7);

}

function buildGen(cfg){

  const pick=a=>a[Math.floor(rng()*a.length)];
  const s=new SB([[0,cfg.bpm]]);
  const PS=[[0,1,1.5,2,3],[0,.5,1,2,3],[0,1.5,2,3],[0,.5,1.5,2.5,3],[0,1,2,2.5,3.5]];
  const PD=[[0,.5,1,1.5,2,2.5,3],[0,.5,1,2,2.5,3,3.5],[0,.75,1.5,2,2.5,3,3.5],[0,.5,1.5,2,2.5,3.5]];
  const motif=(dense,deg)=>{ const out=[]; for(let br=0;br<2;br++){ const p=br===1&&rng()<.45?[0,1,2]:pick(dense?PD:PS);
      for(let j=0;j<p.length;j++){ const o=br*4+p[j], nx=j+1<p.length?br*4+p[j+1]:br*4+4; deg=clamp(deg+pick([-2,-1,-1,0,1,1,2,3,-3]),5,13); out.push({o,d:nx-o,deg}); } } return out; };
  const mot={A:motif(false,9),B:motif(false,8),C:motif(!dnb,10),D:motif(!dnb,11)};
  const snap=(deg,c)=>{ let best=deg,bd=99; for(let k=-4;k<=4;k++){ const r=((deg+k-c)%7+7)%7; if((r===0||r===2||r===4)&&Math.abs(k)<bd){bd=Math.abs(k);best=deg+k;} } return best; };
  const melSec={verse:'ABAB',chorus:'CDCD',chorus2:'CDCD',break:'AB'};
  let bar=0;
  for(const [sec,nb] of cfg.plan){
    const start=bar;
    for(let k=0;k<nb;k++,bar++){ const B=bar*4, c=cfg.prog[bar%cfg.prog.length], chord=[dm(c,1),dm(c+2,1),dm(c+4,1)];
      // drums
      if(dnb){
        for(let i=0;i<8;i++) s.add('hat',B+i*.5,[0],.1,i%2?.7:.4);
        if(sec==='intro'||sec==='outro'){ if(k>=nb/2) s.add('kick',B,[0],.2,.9); }
        else if(sec!=='break'){ s.add('kick',B,[0],.2,1); s.add('kick',B+2.5,[0],.2,.9); s.add('snare',B+1,[0],.2,.9); s.add('snare',B+3,[0],.2,.9);
          if(rng()<.5) s.add('snare',B+3.75,[0],.1,.3); if(sec!=='verse') s.add('kick',B+.75,[0],.2,.5); }
        else if(k===nb-1) for(let i=0;i<16;i++) s.add('snare',B+i*.25,[0],.1,.2+i*.04);
      } else {
        const four=sec==='chorus'||sec==='chorus2';
        if(sec==='break'){ for(let i=0;i<4;i++) s.add('hat',B+i,[0],.1,.5); if(k===nb-1) for(let i=0;i<16;i++) s.add('snare',B+i*.25,[0],.1,.2+i*.04); }
        else { for(let i=0;i<8;i++) s.add('hat',B+i*.5,[0],.1,i%2?.7:.35);
          if(sec!=='intro'||k>=nb/2) for(let i=0;i<4;i++) if(four||i%2===0) s.add('kick',B+i,[0],.2,1);
          if(sec!=='intro') { s.add('snare',B+1,[0],.2,.8); s.add('snare',B+3,[0],.2,.8); } }
        if(four&&k===0) s.add('crash',B,[0],1,.6);
      }
      // bass
      if(sec!=='break'&&(sec!=='intro'||k>=nb/2)){
        if(dnb){ s.add('reese',B,[dm(c,0)],2.4,.8); s.add('reese',B+2.5,[dm(c,0)],1.4,.7); }
        else for(let i=0;i<8;i++) s.add('sbass',B+i*.5,[dm(c,0)+[0,0,12,0,0,12,0,12][i]],.4,.7);
      }
      if(sec!=='intro'&&sec!=='outro') s.add('pad',B,chord,4,.7);
      // arpeggio: carries the chart in intro / outro
      if(sec==='intro'||sec==='outro'||sec==='chorus2'){ const tones=[...chord,dm(c+7,1)], st=dnb?.5:.25, n=4/st;
        for(let i=0;i<n;i++){ const flag=(sec!=='chorus2')&&(i%(dnb?2:4)===0); s.add(dnb?'bell':'pluck',B+i*st,[tones[[0,1,2,3,2,1][i%6]]],st*.9,flag?.6:.45,flag); } }
    }
    const ms=melSec[sec];
    if(ms) for(let m=0;m<ms.length&&m*2<nb;m++) for(const n of mot[ms[m]]){
      const gb=start+m*2+Math.floor(n.o/4), c=cfg.prog[gb%cfg.prog.length];
      if(sec==='break'&&n.o%1!==0) continue;
      let deg=n.deg+(sec==='chorus2'?2:0); if(n.o%1===0) deg=snap(deg,c);
      const bt=(start+m*2)*4+n.o, mid=dm(deg,1), d=sec==='break'?Math.max(n.d,1):n.d;

      if(sec==='chorus2') s.add(dnb?'bell':'lead',bt,[mid-12],d*.9,.35);
    }

  s.add('crash',bar*4,[0],1,.6); s.add(dnb?'reese':'sbass',bar*4,[dm(0,0)],2,.8); s.add('kick',bar*4,[0],.2,1);
  return s.compile({title:cfg.title,by:cfg.by,genre:cfg.genre});
}

// ================================================================ analysing a loaded track
async function analyzeTrack(file,genre){
  setAna('Decoding '+file.name+' …');
  const buf=await AC.decodeAudioData(await file.arrayBuffer());
  setAna('Separating bass, mids and treble …'); await tick();
  const sr=22050, len=Math.ceil(buf.duration*sr), off=new OfflineAudioContext(3,len,sr);
  const src=off.createBufferSource(); src.buffer=buf; const mer=off.createChannelMerger(3);
  const mk=(type,f,q)=>{ const b=off.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q; src.connect(b); return b; };
  mk('lowpass',160,.7).connect(mer,0,0); mk('bandpass',900,.6).connect(mer,0,1); mk('highpass',3500,.7).connect(mer,0,2);
  mer.connect(off.destination); src.start();

    for(let i=3;i<N-3;i++){ const v=f[i]; if(v<=0) continue; let mx=true; for(let j=-3;j<=3;j++) if(j&&f[i+j]>v){mx=false;break;} if(!mx) continue;

function releaseLane(l){
  if(!G||state!=='play') return; const t=songNow();
  for(const n of G.holds) if(n.lane===l&&n.holding){ n.holding=false; if(t<n.end-.12){ floatText(G.ship.x,G.ship.y-60,'RELEASED EARLY','#ff9de2',13); } else holdDone(n); }
  G.holds=G.holds.filter(n=>n.holding);
}
function holdDone(n){ n.holding=false; const v=addScore(150); floatText(G.ship.x,G.ship.y-64,'SUSTAIN +'+v,LANES[n.lane].col,15); G.cres=Math.min(1,G.cres+.02); }
function milestones(){
  if(G.organ){ const s=G.combo>=100?3:G.combo>=50?2:G.combo>=25?1:0; if(s>G.stops){ G.stops=s; floatText(PF/2,300,['','STOP PULLED: TRUMPET','STOP PULLED: MIXTURE','ALL STOPS OUT'][s],'#ffd23f',22); SFX.pick(); } }
  if(G.classical&&G.combo>0&&G.combo%50===0&&G.combo!==G.lastFermataCombo&&G.fermata<2){ G.lastFermataCombo=G.combo; G.fermata++; floatText(PF/2,300,'FERMATA READY  [F]','#c792ff',20); SFX.pick(); }
}

// ---------- weapons
function shipPipes(stops){
  const core=[[2,18],[1,26],[0,34],[0,42],[0,34],[1,26],[2,18]], ex=[[1,15],[2,13],[0,11]].slice(0,stops);
  const list=[...ex.slice().reverse().map(p=>[p[0],p[1],1]),...core.map(p=>[p[0],p[1],0]),...ex.map(p=>[p[0],p[1],1])];
  const step=8.5, x0=-(list.length-1)*step/2;
  return list.map(([lane,h,st],i)=>({dx:x0+i*step,h,lane,stop:!!st}));
}
function addShot(x,y,vx,vy,r,dmg,lane,kind,target){ G.shots.push({x,y,vx,vy,r,dmg,lane,kind,target,life:2}); }
function fire(lane,mult,weak){
  const s=G.ship, P=shipPipes(G.stops), mains=P.filter(p=>p.lane===lane&&!p.stop), stops=P.filter(p=>p.lane===lane&&p.stop);
  G.pipeFl[lane]=1;
  if(weak){ const p=mains[0]; addShot(s.x+p.dx,s.y+8-p.h,0,-600,3,.4,lane,'cap'); return; }
  if(lane===0) addShot(s.x,s.y-36,0,-560,10,4*mult,0,'orb');
  else if(lane===1) for(const p of mains) addShot(s.x+p.dx,s.y+8-p.h,0,-720,5,2.1*mult,1,'cap');
  else for(const p of mains){ const sd=Math.sign(p.dx); for(const a of [-.16,0,.16]){ const an=a+sd*.05; addShot(s.x+p.dx,s.y+8-p.h,Math.sin(an)*900,-Math.cos(an)*900,3,.95*mult,2,'ndl'); } }
  for(const p of stops) addShot(s.x+p.dx,s.y+8-p.h,p.dx*1.4,-650,4,1.3*mult,lane,'cap');
  for(const p of mains) for(let i=0;i<3;i++) part(s.x+p.dx,s.y+8-p.h,rand(-60,60),rand(-200,-60),LANES[lane].col,.3,2);
}
function tutti(){
  if(G.cres<1||G.dead) return; G.cres=0; G.tutti=1; G.shake=REDUCED?0:8; SFX.tutti(G.organ);
  for(const b of G.bullets) part(b.x,b.y,rand(-40,40),rand(-40,40),'#fff',.5,2);
  G.bullets.length=0;
  const dmg=G.organ?40:25;
  for(const e of G.enemies) if(!e.ret) hitEnemy(e,dmg);
  if(G.boss) hitBoss(G.boss.max*(G.organ?.12:.08));
  floatText(PF/2,330,'CANNON IN D!','#ffffff',30);
}
function fermata(){ if(!G.classical||G.fermata<=0||G.dead||G.t<0) return; G.fermata--; G.fermataUntil=G.t+4*beatLen(); floatText(PF/2,330,'FERMATA','#c792ff',30); SFX.pick(); }

// ---------- enemies
function spawnWave(){
  const n=G.wave++, hpm=G.D.ehp*(1+n*.06), rows=Math.min(4,2+Math.floor(n/2)), cols=7;
  G.form={fx:0,tx:0,y:0}; G.waveBeat=G.bi;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if((r*3+c+n)%7===0&&r>0) continue;
    const type=r===0?(n>=2&&c%3===1?'cymbal':'snare'):(r===1&&n>=1&&c%2)?'snare':'drone';
    const sx=(c-(cols-1)/2)*76, sy=78+r*54, side=c<3?-1:c>3?1:(r%2?1:-1);
    G.enemies.push({type,sx,sy,hp:TYPES[type].hp*hpm,max:TYPES[type].hp*hpm,ent:-(c*.05+r*.12),ox:PF/2+side*520,oy:-60-r*30,x:-99,y:-99,flash:0,ret:false,ph:Math.random()*6});
  }
  floatText(PF/2,240,'WAVE '+(n+1),'#e9e4ff',22);
}
function spawnSwoop(){ const side=Math.random()<.5?-1:1; G.enemies.push({type:'swoop',hp:TYPES.swoop.hp*G.D.ehp,max:2,x:PF/2-side*380,y:-30,sw:{t:0,side,tx:G.ship.x},ent:1,flash:0,ret:false,ph:0}); }
function spawnBoss(){ for(const e of G.enemies) e.ret=true; G.boss={x:PF/2,y:-140,tx:PF/2,hp:G.bossHp,max:G.bossHp,flash:0,ang:0}; floatText(PF/2,260,'THE DISSONANCE APPROACHES','#ff5a6e',24); SFX.boom(true); }
function enemyPos(e,dt){
  if(e.type==='swoop'){ const s=e.sw; s.t+=dt*.55*(G.t<G.fermataUntil?.35:1); const u=s.t;
    e.x=lerp(PF/2-s.side*380,s.tx,Math.min(1,u*1.4))+Math.sin(u*5)*30*s.side; e.y=-30+u*720; if(e.y>H+40) e.dead=true; return; }
  if(e.ret){ e.y-=dt*260; e.vx=(e.vx||rand(-80,80)); e.x+=e.vx*dt; if(e.y<-90) e.dead=true; return; }
  const bob=Math.sin(G.t*3+e.ph)*4, tx=PF/2+G.form.fx+e.sx, ty=e.sy+G.form.y+bob;
  e.ent=Math.min(1,e.ent+dt*1.1);
  if(e.ent<1){ const u=Math.max(0,e.ent), k=1-Math.pow(1-u,3); e.x=lerp(e.ox,tx,k); e.y=lerp(e.oy,ty,k)-Math.sin(u*Math.PI)*60; }
  else { e.x=tx; e.y=ty; }
}
function hitEnemy(e,d){ e.hp-=d; e.flash=1; if(e.hp<=0&&!e.dead){ e.dead=true; G.kills++; const v=addScore(TYPES[e.type].pts);
    burst(e.x,e.y,TYPES[e.type].col,e.type==='cymbal'?26:14); SFX.boom(false); if(e.type==='cymbal') floatText(e.x,e.y,'+'+v,'#ff8a3d',13);
    if(Math.random()<.18) G.pickups.push({x:e.x,y:e.y,vy:70,hue:Math.random()*360}); } }
function hitBoss(d){ const b=G.boss; if(!b) return; b.hp-=d; b.flash=1; if(b.hp<=0){ const v=addScore(5000); for(let i=0;i<6;i++) burst(b.x+rand(-100,100),b.y+rand(-40,40),`hsl(${i*60},100%,65%)`,30);
    SFX.boom(true); floatText(PF/2,300,'DISSONANCE RESOLVED +'+v,'#ffd23f',24); G.boss=null; G.bossDone=true; G.shake=REDUCED?0:14; } }
function bullet(x,y,ang,spd,r=5){ G.bullets.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r,hue:(G.bi*47)%360}); }
function onBeat(i){
  const sd=G.sd, bib=((i-sd.barOffset)%4+4)%4, D=G.D, s=G.ship;
  G.pulse=1; if(bib===0) G.barPulse=1;
  G.form.tx+=(Math.floor((i-sd.barOffset)/4)%2?-1:1)*16;
  const t=G.t, progress=t/sd.duration;
  if(bib===0){
    if(!G.boss&&!G.bossDone&&progress>.72) spawnBoss();
    else if(!G.boss){ const live=G.enemies.filter(e=>!e.ret&&e.type!=='swoop');
      if(live.length===0&&t>-.5) spawnWave();
      else if(i-G.waveBeat>=28){ for(const e of live) e.ret=true; spawnWave(); } }
  }
  if(G.wing>0) for(let w=0;w<G.wing;w++){ const tg=nearestEnemy(s.x,s.y); const p=wingPos(w); addShot(p.x,p.y-10,0,-500,4,1.4,[1,0,2][w],'hom',tg); }
  if(t<1.2||G.dead) return;
  const live=G.enemies.filter(e=>!e.ret&&e.ent>=1&&e.type!=='swoop'&&e.y>0);
  const pickN=(arr,n)=>{ const a=arr.slice(), out=[]; while(out.length<n&&a.length) out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); return out; };
  if(bib===0||bib===2) for(const e of pickN(live.filter(e=>e.type==='drone'),D.shoot)) if(Math.random()<D.fire) bullet(e.x,e.y+10,Math.PI/2,D.bspd);
  if(bib===1||bib===3) for(const e of pickN(live.filter(e=>e.type==='snare'),Math.max(1,D.shoot-1))) if(Math.random()<D.fire) bullet(e.x,e.y+10,Math.atan2(s.y-e.y,s.x-e.x),D.bspd*1.05);
  if(bib===0&&Math.floor((i-sd.barOffset)/4)%2===0) for(const e of live.filter(e=>e.type==='cymbal')) if(Math.random()<D.fire){ for(let k=0;k<8;k++) bullet(e.x,e.y,k*Math.PI/4+G.bi*.2,D.bspd*.75,4); }
  if(i%16===8&&live.length&&Math.random()<.3+G.di*.25) spawnSwoop();
  const b=G.boss;
  if(b&&b.y>60){
    b.tx=PF/2+Math.sin(i*.7)*190;
    const a=Math.atan2(s.y-b.y,s.x-b.x);
    if(bib%2===0&&Math.random()<D.fire+.2) for(const o of [-.22,0,.22]) bullet(b.x,b.y+40,a+o,D.bspd*1.1);
    if(bib===0&&Math.floor(i/4)%2===0){ const n=10+G.di*4; for(let k=0;k<n;k++) bullet(b.x,b.y,k*Math.PI*2/n+i*.13,D.bspd*.7,4); }
    if(bib===3){ b.ang+=.6; for(let k=0;k<4+G.di;k++) bullet(b.x,b.y+20,b.ang+k*Math.PI*2/(4+G.di),D.bspd*.85,4); }
  }
}
function nearestEnemy(x,y){ let best=null,bd=1e9; for(const e of G.enemies){ if(e.ret||e.dead||e.y<0) continue; const d=(e.x-x)**2+(e.y-y)**2; if(d<bd){bd=d;best=e;} } if(!best&&G.boss) return G.boss; return best; }
function wingPos(w){ const s=G.ship, o=[[-70,18],[70,18],[0,52]][w]; return {x:s.x+o[0],y:s.y+o[1]}; }

// ---------- particles / text
function part(x,y,vx,vy,col,life,size){ if(G.parts.length<700) G.parts.push({x,y,vx,vy,col,life,max:life,size}); }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.283, sp=rand(40,260); part(x,y,Math.cos(a)*sp,Math.sin(a)*sp,i%3?col:'#ffffff',rand(.3,.8),rand(1.5,3.5)); } }
function floatText(x,y,text,col,size){ G.floats.push({x,y,text,col,size,life:1.3}); }
function hurt(){
  if(G.ship.inv>0||G.dead) return;
  G.hp--; G.ship.inv=1.4; G.shake=REDUCED?0:10; SFX.hurt(); duck(.35); burst(G.ship.x,G.ship.y,'#ff5a6e',18);
  if(G.hp<=0){ G.dead=true; G.deadT=0; burst(G.ship.x,G.ship.y,'#ffd23f',60); SFX.boom(true); G.out.gain.setTargetAtTime(0,AC.currentTime,.6); }
}

// ---------- main update
function updateGame(dt){
  const t=songNow(), D=G.D, s=G.ship; G.t=t;
  const slow=t<G.fermataUntil?.35:1;
  // schedule synthesized events
  if(G.sd.events){ const ev=G.sd.events, horizon=AC.currentTime+.4;
    while(G.ei<ev.length&&G.startAt+ev[G.ei].t<horizon){ const e=ev[G.ei++]; INST[e.inst](Math.max(AC.currentTime,G.startAt+e.t),e.m,e.dur,e.vel,e.mel?G.melBus:G.songBus); } }
  // beats
  const bt=G.sd.beats; while(G.bi<bt.length&&bt[G.bi]<=t){ onBeat(G.bi); G.bi++; }
  // missed notes
  const go=G.win[2];
  for(let i=G.ni;i<G.notes.length;i++){ const n=G.notes[i]; if(n.t>=t-go) break; if(!n.j) missNote(n); }
  while(G.ni<G.notes.length&&G.notes[G.ni].j&&!G.notes[G.ni].holding&&G.notes[G.ni].t<t-go) G.ni++;
  // holds: sustain beam
  for(const n of G.holds){ if(!n.holding) continue;
    if(t>=n.end){ holdDone(n); continue; }
    G.pipeFl[n.lane]=1; if(Math.random()<.3) G.score+=Math.round(5*comboMult());
    const bx=s.x+(n.lane===0?0:n.lane===1?-17:-25.5); let hit=null,hy=-10;
    for(const e of G.enemies){ if(e.ret||e.dead) continue; if(Math.abs(e.x-bx)<26&&e.y<s.y&&e.y>hy){hy=e.y;hit=e;} }
    if(hit) hitEnemy(hit,12*dt); else if(G.boss&&Math.abs(G.boss.x-bx)<120) hitBoss(12*dt);
    n.beamY=hit?hit.y:(G.boss&&Math.abs(G.boss.x-bx)<120?G.boss.y+40:-10);
  }
  G.holds=G.holds.filter(n=>n.holding);
  // ship
  if(!G.dead){
    const ax=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0), ay=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
    s.vx=ax*370; s.x=clamp(s.x+ax*370*dt,40,PF-40); s.y=clamp(s.y+ay*300*dt,460,672);
  }
  s.inv=Math.max(0,s.inv-dt);
  G.shieldOn=(keys.ShiftLeft||keys.ShiftRight)&&G.shield>0&&!G.dead;
  if(G.shieldOn) G.shield=Math.max(0,G.shield-dt*.42); else G.shield=Math.min(1,G.shield+dt*.025);
  G.wing=G.orch?Math.min(3,Math.floor(G.combo/20)):0;
  // formation
  G.form.fx+=(G.form.tx-G.form.fx)*Math.min(1,dt*14); G.form.y=Math.min(110,G.form.y+dt*2.2*slow);
  if(Math.abs(G.form.tx)>120) G.form.tx=Math.sign(G.form.tx)*120;
  for(const e of G.enemies){ enemyPos(e,dt*slow); e.flash=Math.max(0,e.flash-dt*6);
    if(!G.dead&&!e.ret&&e.y>0){ const r=TYPES[e.type].r; if((e.x-s.x)**2+(e.y-s.y)**2<(r+14)**2){ if(G.shieldOn){ hitEnemy(e,99); } else { hurt(); if(e.type==='swoop') hitEnemy(e,99); } } } }
  G.enemies=G.enemies.filter(e=>!e.dead);
  const b=G.boss; if(b){ b.y=lerp(b.y,120,Math.min(1,dt*.8)); b.x=lerp(b.x,b.tx,Math.min(1,dt*2.5*slow)); b.flash=Math.max(0,b.flash-dt*6); }
  // player shots
  for(const sh of G.shots){
    if(sh.kind==='hom'&&sh.target&&!sh.target.dead){ const a=Math.atan2(sh.target.y-sh.y,sh.target.x-sh.x); sh.vx=lerp(sh.vx,Math.cos(a)*520,Math.min(1,dt*6)); sh.vy=lerp(sh.vy,Math.sin(a)*520,Math.min(1,dt*6)); }
    sh.x+=sh.vx*dt; sh.y+=sh.vy*dt; sh.life-=dt;
    if(sh.y<-30||sh.x<-30||sh.x>PF+30||sh.life<=0){ sh.dead=true; continue; }
    for(const e of G.enemies){ if(e.ret||e.dead) continue; const r=TYPES[e.type].r+sh.r; if((e.x-sh.x)**2+(e.y-sh.y)**2<r*r){ hitEnemy(e,sh.dmg); sh.dead=true; part(sh.x,sh.y,rand(-50,50),rand(-50,50),LANES[sh.lane].col,.25,2); break; } }
    if(!sh.dead&&G.boss&&Math.abs(sh.x-G.boss.x)<120&&Math.abs(sh.y-G.boss.y)<45){ hitBoss(sh.dmg); sh.dead=true; part(sh.x,sh.y,rand(-50,50),rand(-80,0),LANES[sh.lane].col,.3,2); }
  }
  G.shots=G.shots.filter(x=>!x.dead);
  // enemy bullets
  for(const bl of G.bullets){ bl.x+=bl.vx*dt*slow; bl.y+=bl.vy*dt*slow;
    if(bl.y>H+20||bl.y<-40||bl.x<-20||bl.x>PF+20){ bl.dead=true; continue; }
    if(G.dead) continue;
    const dx=bl.x-s.x, dy=bl.y-s.y;
    if(G.shieldOn&&dx*dx+dy*dy<(bl.r+30)**2){ bl.dead=true; part(bl.x,bl.y,rand(-60,60),rand(-60,60),'#9ff',.3,2); continue; }
    if(dx*dx+dy*dy<(bl.r+6)**2){ bl.dead=true; hurt(); } }
  G.bullets=G.bullets.filter(x=>!x.dead);
  // pickups (note gems): shield + score
  for(const p of G.pickups){ p.y+=p.vy*dt; if(p.y>H+20) p.dead=true;
    if(!G.dead&&(p.x-s.x)**2+(p.y-s.y)**2<34*34){ p.dead=true; G.shield=Math.min(1,G.shield+.15); const v=addScore(50); floatText(p.x,p.y,'♪ +'+v,`hsl(${p.hue},100%,70%)`,13); SFX.pick(); } }
  G.pickups=G.pickups.filter(p=>!p.dead);
  // fx
  for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.96; p.vy*=.96; p.life-=dt; } G.parts=G.parts.filter(p=>p.life>0);
  for(const f of G.floats){ f.y-=dt*30; f.life-=dt; } G.floats=G.floats.filter(f=>f.life>0);
  if(G.jText){ G.jText.life-=dt*1.6; if(G.jText.life<=0) G.jText=null; }
  G.pulse=Math.max(0,G.pulse-dt*4); G.barPulse=Math.max(0,G.barPulse-dt*2.5); G.shake=Math.max(0,G.shake-dt*30); G.tutti=Math.max(0,G.tutti-dt*1.2);
  for(let l=0;l<3;l++){ G.pipeFl[l]=Math.max(0,G.pipeFl[l]-dt*5); G.laneFx[l]=Math.max(0,G.laneFx[l]-dt*5); }
  // thruster sparks
  if(!G.dead&&Math.random()<.7) part(s.x+rand(-10,10),s.y+28,rand(-20,20),rand(80,160),`hsl(${(t*200)%360},100%,65%)`,.35,2);
  // end conditions
  if(G.dead){ G.deadT+=dt; if(G.deadT>2.2) finish(true); }
  else if(t>G.sd.duration) finish(false);
}
function finish(failed){
  if(G.done) return; G.done=true; G.failed=failed;
  const c=G.cnt, total=Math.max(1,G.notes.length);
  G.acc=(c.perfect+c.great*.8+c.good*.5)/total;
  G.grade=failed?'—':G.acc>=.95?'S':G.acc>=.88?'A':G.acc>=.75?'B':G.acc>=.6?'C':'D';
  const k=bestKey(G.item.id,G.di), prev=store.get(k,0); G.newBest=!failed&&G.score>prev; if(G.newBest) store.set(k,G.score); G.prevBest=prev;
  stopAudio(G); state='results';
}

// ================================================================ input
const GAME_CODES=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyZ','KeyX','KeyC','KeyJ','KeyK','KeyL','KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight','KeyF','Escape','KeyP','Enter','BracketLeft','BracketRight','Minus','Equal','KeyR','Backspace']);
window.addEventListener('keydown',e=>{
  if(GAME_CODES.has(e.code)) e.preventDefault();
  const first=!e.repeat; keys[e.code]=true;
  if(state==='play'){
    if(e.code in LANE_KEYS){ const l=LANE_KEYS[e.code]; if(first&&!laneDown[l]){ laneDown[l]=true; pressLane(l); } return; }
    if(!first) return;
    if(e.code==='Space') tutti(); else if(e.code==='KeyF') fermata();
    else if(e.code==='Escape'||e.code==='KeyP'){ state='pause'; pauseIdx=0; AC.suspend(); }
    return;
  }
  if(!first&&!['ArrowUp','ArrowDown'].includes(e.code)) return;
  initAudio(); if(AC.state==='suspended'&&state!=='pause') AC.resume();
  if(state==='title'){ if(e.code==='Enter'||e.code==='Space'){ state='select'; SFX.blip(880); } return; }
  if(state==='select') return selectKey(e.code);
  if(state==='genre'){
    if(e.code==='ArrowUp'){ genreIdx=(genreIdx+PICK_GENRES.length-1)%PICK_GENRES.length; SFX.blip(); }
    else if(e.code==='ArrowDown'){ genreIdx=(genreIdx+1)%PICK_GENRES.length; SFX.blip(); }
    else if(e.code==='Escape'){ state='select'; pendingFile=null; }
    else if(e.code==='Enter') runAnalysis(pendingFile,PICK_GENRES[genreIdx]);
    return; }
  if(state==='pause'){
    const opts=['resume','restart','quit'];
    if(e.code==='ArrowUp'||e.code==='ArrowDown'){ pauseIdx=(pauseIdx+(e.code==='ArrowUp'?2:1))%3; }
    else if(e.code==='Escape'||e.code==='KeyP'||(e.code==='Enter'&&opts[pauseIdx]==='resume')){ AC.resume(); state='play'; }
    else if(e.code==='Enter'){ AC.resume(); if(opts[pauseIdx]==='restart') startSong(G.item); else { stopAudio(G); G=null; state='select'; } }
    return; }
  if(state==='results'){ if(e.code==='KeyR') startSong(G.item); else if(e.code==='Enter'||e.code==='Escape'){ state='select'; SFX.blip(); } }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; if(e.code in LANE_KEYS){ const l=LANE_KEYS[e.code];
  const other=Object.keys(LANE_KEYS).some(k=>k!==e.code&&LANE_KEYS[k]===l&&keys[k]); if(!other){ laneDown[l]=false; releaseLane(l); } } });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; laneDown.fill(false); if(state==='play'&&G){ state='pause'; pauseIdx=0; AC.suspend(); } });
function selectKey(code){
  const items=menuItems();
  if(code==='ArrowUp'){ selIdx=(selIdx+items.length-1)%items.length; SFX.blip(); }
  else if(code==='ArrowDown'){ selIdx=(selIdx+1)%items.length; SFX.blip(); }
  else if(code==='ArrowLeft'||code==='ArrowRight'){ settings.diff=clamp(settings.diff+(code==='ArrowLeft'?-1:1),0,2); store.set('diff',settings.diff); SFX.blip(520); }
  else if(code==='BracketLeft'||code==='BracketRight'){ settings.offset=clamp(settings.offset+(code==='BracketLeft'?-10:10),-300,300); store.set('offset',settings.offset); }
  else if(code==='Minus'||code==='Equal'){ settings.speed=Math.round(clamp(settings.speed+(code==='Minus'?-.1:.1),.6,1.8)*10)/10; store.set('speed',settings.speed); }
  else if(code==='Escape'||code==='Backspace') state='title';
  else if(code==='Enter'){ const it=items[selIdx]; if(it.load) document.getElementById('file').click(); else startSong(it); }
}
document.getElementById('file').addEventListener('change',e=>{ const f=e.target.files[0]; e.target.value=''; if(f) chooseGenre(f); cv.focus(); });

function chooseGenre(f){ pendingFile=f; genreIdx=0; state='genre'; }
async function runAnalysis(file,genre){
  state='analyze'; initAudio(); await AC.resume();
  try{ const sd=await analyzeTrack(file,genre);
    const item={id:'user'+userTracks.length+'_'+sd.title,title:sd.title,by:sd.by,genre,bpm:sd.bpm,sd,user:true};
    userTracks.push(item); selIdx=SONGS.length+userTracks.length-1; state='select'; setFlash('Ready. Press Enter to play '+sd.title+'.');
  }catch(err){ console.error(err); state='select'; setFlash('That file could not be read. Try an MP3, OGG or WAV file.'); }
}

const stars=[]; for(let i=0;i<220;i++) stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random(),h:Math.random()*360});
const neb=document.createElement('canvas'); neb.width=PF; neb.height=H;
(function(){ const n=neb.getContext('2d'); const rr=mulberry32(99);
  for(let i=0;i<14;i++){ const x=rr()*PF,y=rr()*H,r=120+rr()*260,h=[300,190,265,330,20,160][i%6];
    for(const oy of [-H,0,H]){ const gr=n.createRadialGradient(x,y+oy,0,x,y+oy,r); gr.addColorStop(0,`hsla(${h},90%,45%,.16)`); gr.addColorStop(1,'hsla(0,0%,0%,0)'); n.fillStyle=gr; n.fillRect(0,0,PF,H); } } })();
function drawBG(dt,width,cath,pulse,t){
  g.fillStyle='#05030d'; g.fillRect(0,0,width,H);
  const off=(t*14)%H; g.drawImage(neb,0,off-H,width,H); g.drawImage(neb,0,off,width,H);
  if(cath) drawRose(t,pulse,width);
  const boost=1+pulse*2.5;
  for(const s of stars){ if(s.x>width) continue; s.y+=dt*(20+s.z*110)*boost; if(s.y>H){ s.y=0; s.x=Math.random()*width; }
    g.fillStyle=`hsla(${s.h},80%,${70+s.z*25}%,${.35+s.z*.6})`; const sz=.6+s.z*1.8; g.fillRect(s.x,s.y,sz,sz*(1+pulse*s.z*3)); }
}
function drawRose(t,pulse,width){
  const cx=width/2, cy=250, R=240; g.save(); g.globalCompositeOperation='lighter'; g.translate(cx,cy); g.globalAlpha=.11+.1*pulse;
  g.rotate(t*.04);
  for(let i=0;i<12;i++){ g.rotate(Math.PI/6); g.fillStyle=`hsl(${(i*30+t*15)%360},90%,55%)`; g.beginPath(); g.ellipse(0,-R*.58,R*.15,R*.36,0,0,Math.PI*2); g.fill();
    g.fillStyle=`hsl(${(i*30+180+t*15)%360},90%,55%)`; g.beginPath(); g.arc(0,-R*.2,R*.08,0,Math.PI*2); g.fill(); }
  g.globalAlpha=.2+.15*pulse; g.strokeStyle='#ffd23f'; g.lineWidth=2; for(const rr of [R*.98,R*.4,R*.12]){ g.beginPath(); g.arc(0,0,rr,0,Math.PI*2); g.stroke(); }
  g.restore();
}
function glow(x,y,r,col,a){ g.globalAlpha=a; g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); g.globalAlpha=1; }
function drawShip(x,y,fl,stops,t,shield,inv){
  if(inv>0&&Math.floor(inv*14)%2) return;
  g.save(); g.translate(x,y);
  const P=shipPipes(stops), halfW=(P.length-1)*8.5/2+12;
  // thruster
  g.globalCompositeOperation='lighter';
  const fh=16+Math.sin(t*40)*5+Math.random()*4;
  const fg=g.createLinearGradient(0,24,0,24+fh); fg.addColorStop(0,`hsla(${(t*220)%360},100%,70%,.9)`); fg.addColorStop(1,'hsla(0,0%,0%,0)');
  g.fillStyle=fg; g.beginPath(); g.moveTo(-14,24); g.lineTo(14,24); g.lineTo(0,24+fh); g.closePath(); g.fill();
  g.globalCompositeOperation='source-over';
  // wings
  g.fillStyle='#b8860b'; for(const sd of [-1,1]){ g.beginPath(); g.moveTo(sd*(halfW-6),10); g.lineTo(sd*(halfW+22),28); g.lineTo(sd*(halfW+4),26); g.lineTo(sd*(halfW-10),22); g.closePath(); g.fill(); }
  g.strokeStyle='#ffe58a'; g.lineWidth=1; for(const sd of [-1,1]){ g.beginPath(); g.moveTo(sd*(halfW-6),10); g.lineTo(sd*(halfW+22),28); g.stroke(); }

    const pg=g.createLinearGradient(x0,0,x0+7,0); pg.addColorStop(0,'#5c6475'); pg.addColorStop(.45,'#f3f6fb'); pg.addColorStop(1,'#8a93a5');
    g.fillStyle=pg; g.fillRect(x0,top,7,p.h);
    g.fillStyle='#1b1430'; g.beginPath(); g.moveTo(x0+1.5,4); g.lineTo(x0+5.5,4); g.lineTo(x0+4.5,1); g.lineTo(x0+2.5,1); g.closePath(); g.fill();
    const c=LANES[p.lane], f=fl[p.lane];
    g.globalCompositeOperation='lighter'; glow(p.dx,top,5+f*9,c.col,.35+f*.6); g.globalCompositeOperation='source-over';
    g.fillStyle=f>.2?c.hi:c.col; g.fillRect(x0,top-2,7,3);

  // console with a keyboard manual

  g.fillStyle=wg; g.beginPath(); g.moveTo(-cw,8); g.lineTo(cw,8); g.lineTo(cw-7,26); g.lineTo(-cw+7,26); g.closePath(); g.fill();
  g.strokeStyle='#ffd23f'; g.lineWidth=1.2; g.beginPath(); g.moveTo(-cw,8.5); g.lineTo(cw,8.5); g.stroke();
  g.fillStyle='#f4efe2'; const kw=4, kn=Math.floor((cw*2-18)/kw); for(let i=0;i<kn;i++) g.fillRect(-cw+9+i*kw,13,kw-1,7);
  g.fillStyle='#120c1c'; for(let i=0;i<kn-1;i++) if([0,1,3,4,5][i%7]!==undefined&&i%7!==2&&i%7!==6) g.fillRect(-cw+11.5+i*kw,13,2,4);
  if(shield){ g.globalCompositeOperation='lighter'; g.strokeStyle=`hsla(${(t*120)%360},100%,70%,.8)`; g.lineWidth=2.5; g.beginPath(); g.arc(0,0,38+Math.sin(t*20)*1.5,0,Math.PI*2); g.stroke(); glow(0,0,38,'#66e0ff',.12); }
  g.restore();

function drawEnemy(e,t,pulse){
  const T=TYPES[e.type], sc=1+pulse*.13, r=T.r*sc, col=e.flash>.3?'#ffffff':T.col;
  g.save(); g.translate(e.x,e.y);
  g.globalCompositeOperation='lighter'; glow(0,0,r*1.9,T.col,.16+pulse*.15); g.globalCompositeOperation='source-over';
  g.fillStyle=col; g.strokeStyle='#ffffff'; g.lineWidth=1.2;
  if(e.type==='drone'){ g.beginPath(); for(let i=0;i<6;i++){ const a=i*Math.PI/3+t; g.lineTo(Math.cos(a)*r,Math.sin(a)*r*.8); } g.closePath(); g.fill();
    g.fillStyle='#1a0420'; g.beginPath(); g.arc(0,0,r*.38,0,Math.PI*2); g.fill(); g.fillStyle='#fff'; g.beginPath(); g.arc(0,r*.08,r*.15,0,Math.PI*2); g.fill(); }
  else if(e.type==='snare'){ g.beginPath(); g.moveTo(0,-r); g.lineTo(r,0); g.lineTo(0,r); g.lineTo(-r,0); g.closePath(); g.fill();
    g.strokeStyle='#5a3b00'; g.beginPath(); g.ellipse(0,0,r*.55,r*.3,0,0,Math.PI*2); g.stroke(); g.beginPath(); g.moveTo(-r*.55,0); g.lineTo(r*.55,0); g.stroke(); }
  else if(e.type==='cymbal'){ g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.fill(); g.fillStyle='#3a1500'; g.beginPath(); g.arc(0,0,r*.62,0,Math.PI*2); g.fill();
    g.strokeStyle=col; g.lineWidth=2; for(let i=0;i<6;i++){ const a=i*Math.PI/3-t*2; g.beginPath(); g.moveTo(Math.cos(a)*r*.2,Math.sin(a)*r*.2); g.lineTo(Math.cos(a)*r*.6,Math.sin(a)*r*.6); g.stroke(); }
    g.fillStyle=col; g.beginPath(); g.arc(0,0,r*.2,0,Math.PI*2); g.fill(); }
  else { g.beginPath(); g.moveTo(0,r); g.lineTo(r,-r*.6); g.lineTo(0,-r*.1); g.lineTo(-r,-r*.6); g.closePath(); g.fill(); }
  if(e.hp<e.max&&e.type!=='swoop'){ g.fillStyle='rgba(255,255,255,.2)'; g.fillRect(-r,r+4,r*2,2); g.fillStyle=T.col; g.fillRect(-r,r+4,r*2*clamp(e.hp/e.max,0,1),2); }
  g.restore();
}
function drawBoss(b,t,pulse){

  g.globalCompositeOperation='lighter'; glow(0,0,130,'#ff2850',.12+pulse*.12); g.globalCompositeOperation='source-over';

  g.fillStyle=bg; g.beginPath(); g.moveTo(-120,0); g.lineTo(-80,-40); g.lineTo(80,-40); g.lineTo(120,0); g.lineTo(70,44); g.lineTo(-70,44); g.closePath(); g.fill();

function drawGame(dt){
  const t=G.t;
  g.save();
  if(G.shake>0) g.translate(rand(-G.shake,G.shake)*.5,rand(-G.shake,G.shake)*.5);
  g.save(); g.beginPath(); g.rect(0,0,PF,H); g.clip();
  drawBG(dt,PF,G.cath,G.pulse,Math.max(0,t)+menuT*.05);
  if(t<G.fermataUntil){ g.fillStyle='rgba(199,146,255,.08)'; g.fillRect(0,0,PF,H); }
  g.globalCompositeOperation='lighter'; g.globalAlpha=G.barPulse*.12; g.fillStyle=G.gk.col; g.fillRect(0,0,PF,H); g.globalAlpha=1; g.globalCompositeOperation='source-over';
  for(const e of G.enemies) drawEnemy(e,t,G.pulse);
  if(G.boss) drawBoss(G.boss,t,G.pulse);
  // pickups
  for(const p of G.pickups){ g.globalCompositeOperation='lighter'; glow(p.x,p.y,12,`hsl(${p.hue},100%,60%)`,.4); g.globalCompositeOperation='source-over';
    g.fillStyle=`hsl(${p.hue},100%,80%)`; g.font=font(700,18); g.textAlign='center'; g.textBaseline='middle'; g.fillText('♪',p.x,p.y); }
  // sustain beams
  g.globalCompositeOperation='lighter';
  for(const n of G.holds){ if(!n.holding) continue; const bx=G.ship.x+(n.lane===0?0:n.lane===1?-17:-25.5), top=n.beamY??-10, by=G.ship.y-30;
    const w=10+Math.sin(t*50)*2; const bgd=g.createLinearGradient(bx-w,0,bx+w,0); bgd.addColorStop(0,'rgba(0,0,0,0)'); bgd.addColorStop(.5,LANES[n.lane].col); bgd.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=bgd; g.fillRect(bx-w,top,w*2,by-top); g.fillStyle='rgba(255,255,255,.8)'; g.fillRect(bx-1.5,top,3,by-top);
    if(n.lane!==0){ g.fillStyle=bgd; g.fillRect(-bx+2*G.ship.x-w,top,w*2,by-top); } }
  // player shots
  for(const s of G.shots){ const c=LANES[s.lane].col;
    if(s.kind==='orb'){ glow(s.x,s.y,s.r*2.2,c,.35); glow(s.x,s.y,s.r,c,.9); glow(s.x,s.y,s.r*.45,'#fff',1); }
    else if(s.kind==='ndl'){ g.strokeStyle=c; g.lineWidth=2.5; g.beginPath(); g.moveTo(s.x,s.y); g.lineTo(s.x-s.vx*.018,s.y-s.vy*.018); g.stroke(); }
    else { glow(s.x,s.y,s.r*2,c,.3); g.fillStyle=c; g.fillRect(s.x-s.r*.6,s.y-s.r*1.8,s.r*1.2,s.r*3.6); g.fillStyle='#fff'; g.fillRect(s.x-1,s.y-s.r*1.4,2,s.r*2.8); } }
  // particles
  for(const p of G.parts){ g.globalAlpha=clamp(p.life/p.max,0,1); g.fillStyle=p.col; g.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); } g.globalAlpha=1;
  // enemy bullets
  for(const b of G.bullets){ const c=`hsl(${b.hue},100%,62%)`; glow(b.x,b.y,b.r*2.4,c,.35); } g.globalCompositeOperation='source-over';
  for(const b of G.bullets){ g.fillStyle=`hsl(${b.hue},100%,80%)`; g.beginPath(); g.arc(b.x,b.y,b.r,0,Math.PI*2); g.fill(); g.fillStyle='#fff'; g.beginPath(); g.arc(b.x,b.y,b.r*.45,0,Math.PI*2); g.fill(); }
  // wingmen
  for(let w=0;w<G.wing;w++){ const p=wingPos(w), c=['#3dffb0','#ffd23f','#5fb8ff'][w], lbl=['STR','BRS','WND'][w];
    g.globalCompositeOperation='lighter'; glow(p.x,p.y,16,c,.25+G.pulse*.3); g.globalCompositeOperation='source-over';
    g.fillStyle=c; g.beginPath(); g.moveTo(p.x,p.y-12); g.lineTo(p.x+10,p.y+8); g.lineTo(p.x-10,p.y+8); g.closePath(); g.fill();
    g.fillStyle='#e9e4ff'; g.font=font(600,9); g.textAlign='center'; g.fillText(lbl,p.x,p.y+20); }
  if(!G.dead) drawShip(G.ship.x,G.ship.y,G.pipeFl,G.stops,t,G.shieldOn,G.ship.inv);
  // tutti wave
  if(G.tutti>0){ const k=1-G.tutti; g.globalCompositeOperation='lighter'; for(let i=0;i<6;i++){ g.strokeStyle=`hsla(${i*60+k*200},100%,65%,${G.tutti})`; g.lineWidth=6; g.beginPath(); g.arc(G.ship.x,G.ship.y,k*900-i*30,Math.PI,2*Math.PI); g.stroke(); }
    g.globalAlpha=G.tutti*.25; g.fillStyle='#fff'; g.fillRect(0,0,PF,H); g.globalAlpha=1; g.globalCompositeOperation='source-over'; }
  // floating text
  g.textAlign='center'; g.textBaseline='middle';
  for(const f of G.floats){ g.globalAlpha=clamp(f.life,0,1); g.fillStyle=f.col; g.font=font(700,f.size); g.fillText(f.text,f.x,f.y); } g.globalAlpha=1;
  if(G.jText&&!G.dead){ g.globalAlpha=clamp(G.jText.life,0,1); g.fillStyle=G.jText.col; g.font=font(700,15); g.fillText(G.jText.text,G.ship.x,G.ship.y-52); g.globalAlpha=1; }
  drawFieldHUD(t);

  if(G.dead){ g.fillStyle='#ff5a6e'; g.font=font(900,44,DISP); g.fillText('Hull Breached',PF/2,H/2); }
  g.restore();
  drawPanel(t);
  g.restore();
}

function drawPanel(t){
  const X=PF; g.fillStyle='#0a0618'; g.fillRect(X,0,W-X,H);
  g.fillStyle=G.gk.col; g.globalAlpha=.6; g.fillRect(X,0,2,H); g.globalAlpha=1;
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillStyle='#8f86b8'; g.font=font(600,11); g.fillText('SCORE',X+24,30);
  g.fillStyle='#e9e4ff'; g.font=font(700,30); g.fillText(G.score.toLocaleString('en-US'),X+24,62);
  g.font=font(700,16); g.fillStyle=G.combo>=16?'#ffd23f':'#e9e4ff'; g.fillText(G.combo+' COMBO',X+24,90);
  g.textAlign='right'; g.fillStyle='#ff9de2'; g.fillText('×'+comboMult(),W-24,90);
  const judged=G.cnt.perfect+G.cnt.great+G.cnt.good+G.cnt.miss;
  g.font=font(600,11); g.fillStyle='#8f86b8'; g.fillText(judged?`ACC ${Math.round((G.cnt.perfect+G.cnt.great*.8+G.cnt.good*.5)/judged*100)}%`:'ACC —',W-24,30);
  g.fillText(G.D.name.toUpperCase(),W-24,46);
  // highway
  const L0=X+29, LW=88, top=112, jy=598, lead=G.lead;
  const yOf=tt=>jy-(tt-t)/lead*(jy-top);
  for(let l=0;l<3;l++){ const lx=L0+l*LW; const gr=g.createLinearGradient(0,top,0,jy); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,LANES[l].col+'26');
    g.fillStyle=gr; g.fillRect(lx,top,LW,jy-top); if(G.laneFx[l]>0){ g.fillStyle=LANES[l].col; g.globalAlpha=G.laneFx[l]*.2; g.fillRect(lx,top,LW,jy-top); g.globalAlpha=1; }
    g.fillStyle='rgba(255,255,255,.07)'; g.fillRect(lx,top,1,jy-top); }
  g.fillStyle='rgba(255,255,255,.07)'; g.fillRect(L0+3*LW,top,1,jy-top);
  const bt=G.sd.beats;
  for(let i=Math.max(0,G.bi-2);i<bt.length;i++){ if(bt[i]>t+lead) break; if(bt[i]<t) continue; const y=yOf(bt[i]); const bar=((i-G.sd.barOffset)%4+4)%4===0;
    g.fillStyle=bar?'rgba(255,210,63,.32)':'rgba(255,255,255,.1)'; g.fillRect(L0,y,LW*3,bar?2:1); }
  // notes
  g.save(); g.beginPath(); g.rect(X,top-10,W-X,jy-top+22); g.clip();
  for(let i=Math.max(0,G.ni-20);i<G.notes.length;i++){ const n=G.notes[i]; if(n.t>t+lead) break;
    if(n.j&&!n.holding) continue; if(n.j==null&&n.t<t-G.win[2]) continue;
    const c=LANES[n.lane], cx=L0+n.lane*LW+LW/2;
    let y=yOf(n.t); if(n.holding) y=jy;
    if(n.end){ const y2=Math.max(top-10,yOf(n.end)); g.fillStyle=c.col; g.globalAlpha=n.holding?.85:.45; g.fillRect(cx-10,y2,20,y-y2); g.globalAlpha=1;
      g.fillStyle='#fff'; g.fillRect(cx-2,y2,4,y-y2); }
    g.globalCompositeOperation='lighter'; glow(cx,y,26,c.col,.18); g.globalCompositeOperation='source-over';
    const gg=g.createLinearGradient(0,y-9,0,y+9); gg.addColorStop(0,c.hi); gg.addColorStop(1,c.col);
    g.fillStyle=gg; rrect(cx-34,y-8,68,16,5); g.fill();
    if(n.chord!=null){ g.strokeStyle='#ffd23f'; g.lineWidth=2; rrect(cx-36,y-10,72,20,6); g.stroke(); }
    g.fillStyle='rgba(255,255,255,.9)'; g.fillRect(cx-24,y-5,48,2);
  }
  g.restore();
  // judge line + keys
  g.fillStyle='#ffffff'; g.globalAlpha=.6+G.pulse*.4; g.fillRect(L0-4,jy-1,LW*3+8,3); g.globalAlpha=1;
  for(let l=0;l<3;l++){ const lx=L0+l*LW+6, c=LANES[l], down=laneDown[l];
    g.fillStyle=down?c.col:'rgba(255,255,255,.05)'; rrect(lx,jy+14,LW-12,40,6); g.fill(); g.strokeStyle=c.col; g.lineWidth=1.5; g.stroke();
    g.textAlign='center'; g.fillStyle=down?'#0a0618':c.col; g.font=font(700,14); g.fillText(c.keys,lx+(LW-12)/2,jy+33); g.font=font(600,9); g.fillText(c.name,lx+(LW-12)/2,jy+47); }
  if(G.jText){ g.textAlign='center'; g.globalAlpha=clamp(G.jText.life,0,1); g.fillStyle=G.jText.col; g.font=font(700,18); g.fillText(G.jText.text,L0+LW*1.5,jy-24); g.globalAlpha=1; }
  // song progress
  g.textAlign='left'; g.fillStyle='#8f86b8'; g.font=font(600,10); g.fillText(G.sd.title.toUpperCase().slice(0,34),X+24,H-26);
  g.fillStyle='rgba(255,255,255,.1)'; g.fillRect(X+24,H-18,W-X-48,4); g.fillStyle=G.gk.col; g.fillRect(X+24,H-18,(W-X-48)*clamp(t/G.sd.duration,0,1),4);
  if(G.boss===null&&!G.bossDone){ const bx=X+24+(W-X-48)*.72; g.fillStyle='#ff5a6e'; g.fillRect(bx-1,H-21,2,10); }
}
function rrect(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

// ---------- menus
function drawTitle(){
  const t=menuT;
  g.textAlign='center'; g.textBaseline='middle';
  const tg=g.createLinearGradient(W/2-330,0,W/2+330,0); for(let i=0;i<=6;i++) tg.addColorStop(i/6,`hsl(${(i*55+t*40)%360},100%,68%)`);
  g.fillStyle=tg; g.font=font(900,74,DISP); g.fillText('Cathedral Nova',W/2,180);
  g.fillStyle='#e9e4ff'; g.font=font(600,16); g.fillText('A RHYTHM SHOOTER FOR ONE PIPE-ORGAN STARSHIP',W/2,240);
  g.save(); g.translate(W/2,380); g.scale(2.2,2.2); drawShip(0,0,[(Math.sin(t*6)+1)/2,(Math.sin(t*6+2)+1)/2,(Math.sin(t*6+4)+1)/2],Math.floor(t/2)%4,t,false,0); g.restore();
  g.globalAlpha=.55+.45*Math.sin(t*4); g.fillStyle='#ffd23f'; g.font=font(700,20); g.fillText('PRESS ENTER',W/2,520); g.globalAlpha=1;
  g.fillStyle='#8f86b8'; g.font=font(400,14);
  g.fillText('Fire each pipe on its note. Dodge the beat. Classical, orchestral and organ music unlock Cathedral Mode.',W/2,580);
  g.fillText('Fly: arrows / WASD    Fire: Z X C or J K L    Shield: Shift    Cannon in D: Space    Pause: Esc',W/2,606);
}
function drawSelect(){
  const items=menuItems(), D=DIFF[settings.diff];
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillStyle='#e9e4ff'; g.font=font(900,34,DISP); g.fillText('Choose a Score',56,74);
  g.fillStyle='#8f86b8'; g.font=font(400,13); g.fillText('↑ ↓ pick    ← → difficulty    Enter play    Esc back',58,100);
  const y0=140, rh=52;
  items.forEach((it,i)=>{ const y=y0+i*rh, sel=i===selIdx, gk=GENRES[it.genre]||GENRES.other;
    if(sel){ g.fillStyle='rgba(255,255,255,.07)'; rrect(44,y-30,440,46,8); g.fill(); g.fillStyle=it.load?'#e9e4ff':gk.col; g.fillRect(44,y-30,3,46); }
    g.fillStyle=sel?'#ffffff':'#c9c2ea'; g.font=font(700,17); g.fillText(it.title,62,y-6);
    g.font=font(400,12); g.fillStyle='#8f86b8'; g.fillText(it.load?'MP3, OGG, WAV, M4A · or drop a file on the page':it.by,62,y+10);
    if(!it.load){ g.textAlign='right'; g.fillStyle=gk.col; g.font=font(600,11); g.fillText(gk.label.toUpperCase()+(gk.cath?'  ✦':''),474,y-6); g.textAlign='left'; } });
  // details card
  const it=items[selIdx], cx=520, cy=130;
  g.fillStyle='rgba(10,6,24,.82)'; rrect(cx,cy,450,470,12); g.fill(); g.strokeStyle='#2a1f4d'; g.lineWidth=1; g.stroke();
  if(it.load){ g.fillStyle='#e9e4ff'; g.font=font(700,22); g.fillText('Bring your own music',cx+28,cy+48);
    wrap('Pick any audio file. The game listens for its tempo, then charts bass, mid and treble hits into the three pipes. Tag it Pipe Organ, Orchestral or Classical to unlock that genre\'s bonuses.',cx+28,cy+82,394,20,'#c9c2ea',14);
  } else { const gk=GENRES[it.genre]||GENRES.other;
    g.fillStyle=gk.col; g.font=font(600,12); g.fillText(gk.label.toUpperCase()+'  ·  '+it.bpm+' BPM',cx+28,cy+40);
    g.fillStyle='#ffffff'; g.font=font(700,24); g.fillText(it.title,cx+28,cy+72);
    g.fillStyle='#8f86b8'; g.font=font(400,13); g.fillText(it.by,cx+28,cy+94);
    let y=cy+132;
    if(gk.cath){ g.fillStyle='#ffd23f'; g.font=font(700,13); g.fillText('✦ CATHEDRAL MODE',cx+28,y); y=wrap(CATH_PERK,cx+28,y+22,394,19,'#c9c2ea',13)+10;
      g.fillStyle=gk.col; g.font=font(700,13); g.fillText(gk.label.toUpperCase()+' BONUS',cx+28,y); y=wrap(gk.perk,cx+28,y+22,394,19,'#c9c2ea',13); }
    else y=wrap('Standard flight. Hit notes on time to fire full-power shots, and build combo to multiply your score.',cx+28,y,394,19,'#c9c2ea',13);
    const best=store.get(bestKey(it.id,settings.diff),0);
    g.fillStyle='#8f86b8'; g.font=font(600,11); g.fillText('BEST ('+D.name.toUpperCase()+')',cx+28,cy+372); g.fillStyle='#e9e4ff'; g.font=font(700,20); g.fillText(best?best.toLocaleString('en-US'):'—',cx+28,cy+396);
  }
  // difficulty + settings
  const sy=cy+430; g.font=font(600,11); g.fillStyle='#8f86b8'; g.fillText('DIFFICULTY',cx+28,sy);
  DIFF.forEach((d,i)=>{ const x=cx+110+i*82; g.fillStyle=i===settings.diff?'#ffd23f':'rgba(255,255,255,.08)'; rrect(x,sy-15,74,22,5); g.fill();
    g.fillStyle=i===settings.diff?'#0a0618':'#c9c2ea'; g.font=font(700,12); g.textAlign='center'; g.fillText(d.name,x+37,sy); g.textAlign='left'; });
  g.fillStyle='#8f86b8'; g.font=font(400,12);
  g.fillText(`Audio offset ${settings.offset>0?'+':''}${settings.offset} ms  [ ]      Note speed ${settings.speed.toFixed(1)}×  − =`,cx,cy+500);
  if(flashT>0){ g.fillStyle='#ffd23f'; g.font=font(600,13); g.fillText(flash,56,H-28); }
}
function wrap(text,x,y,maxW,lh,col,size){ g.fillStyle=col; g.font=font(400,size); const words=text.split(' '); let line='';
  for(const w of words){ const test=line?line+' '+w:w; if(g.measureText(test).width>maxW&&line){ g.fillText(line,x,y); y+=lh; line=w; } else line=test; }
  if(line){ g.fillText(line,x,y); y+=lh; } return y; }
function drawGenre(){
  g.fillStyle='rgba(5,3,13,.85)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#e9e4ff'; g.font=font(900,30,DISP); g.fillText('What kind of music is this?',W/2,120);
  g.fillStyle='#8f86b8'; g.font=font(400,13); g.fillText((pendingFile?pendingFile.name:'')+'   ·   ↑ ↓ choose   Enter analyse   Esc cancel',W/2,150);
  PICK_GENRES.forEach((k,i)=>{ const gk=GENRES[k], y=200+i*50, sel=i===genreIdx;
    g.fillStyle=sel?'rgba(255,255,255,.09)':'rgba(255,255,255,.02)'; rrect(W/2-280,y-24,560,42,8); g.fill(); if(sel){ g.strokeStyle=gk.col; g.lineWidth=1.5; g.stroke(); }
    g.textAlign='left'; g.fillStyle=gk.col; g.font=font(700,16); g.fillText(gk.label+(gk.cath?'  ✦ Cathedral Mode':''),W/2-260,y+2);
    if(gk.perk&&sel){ g.fillStyle='#c9c2ea'; g.font=font(400,11); g.fillText(gk.perk.slice(0,92)+(gk.perk.length>92?'…':''),W/2-260,y+15); } });
}
function drawPause(){
  g.fillStyle='rgba(5,3,13,.7)'; g.fillRect(0,0,W,H); g.textAlign='center'; g.fillStyle='#e9e4ff'; g.font=font(900,44,DISP); g.fillText('Paused',PF/2,250);
  ['Resume','Restart','Quit to song list'].forEach((o,i)=>{ g.fillStyle=i===pauseIdx?'#ffd23f':'#8f86b8'; g.font=font(700,20); g.fillText((i===pauseIdx?'▸ ':'')+o,PF/2,320+i*40); });
  g.fillStyle='#8f86b8'; g.font=font(400,12); g.fillText('↑ ↓ choose   Enter confirm   Esc resume',PF/2,470);
}
function drawResults(){
  g.fillStyle='rgba(5,3,13,.86)'; g.fillRect(0,0,W,H); g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillStyle=G.failed?'#ff5a6e':'#e9e4ff'; g.font=font(900,40,DISP); g.fillText(G.failed?'Hull Breached':'Final Cadence',W/2,110);
  g.fillStyle='#8f86b8'; g.font=font(600,14); g.fillText(G.sd.title+'  ·  '+G.D.name,W/2,140);
  if(!G.failed){ const gt=g.createLinearGradient(W/2-60,0,W/2+60,0); gt.addColorStop(0,'#ff4fd8'); gt.addColorStop(.5,'#ffd23f'); gt.addColorStop(1,'#3df5ff');
    g.fillStyle=gt; g.font=font(900,110,DISP); g.fillText(G.grade,W/2,270); }
  g.fillStyle='#ffffff'; g.font=font(700,36); g.fillText(G.score.toLocaleString('en-US'),W/2,340);
  if(G.newBest){ g.fillStyle='#ffd23f'; g.font=font(700,14); g.fillText('NEW BEST',W/2,364); }
  const c=G.cnt, rows=[['Perfect',c.perfect,'#fff27a'],['Great',c.great,'#7affc1'],['Good',c.good,'#7ab8ff'],['Miss',c.miss,'#ff5a6e'],['Off-beat',c.clam,'#ff9de2'],
    ['Max combo',G.maxCombo,'#e9e4ff'],['Accuracy',Math.round(G.acc*100)+'%','#e9e4ff'],['Enemies',G.kills,'#e9e4ff']];
  rows.forEach((r,i)=>{ const col=i%4, row=Math.floor(i/4), x=W/2-300+col*200, y=420+row*64;
    g.fillStyle='#8f86b8'; g.font=font(600,11); g.fillText(r[0].toUpperCase(),x,y); g.fillStyle=r[2]; g.font=font(700,24); g.fillText(String(r[1]),x,y+28); });
  g.fillStyle='#ffd23f'; g.font=font(700,15); g.fillText('Enter: song list     R: play again',W/2,H-60);
}
function drawAnalyze(){ g.textAlign='center'; g.fillStyle='#e9e4ff'; g.font=font(900,32,DISP); g.fillText('Listening …',W/2,H/2-30);
  g.fillStyle='#c9c2ea'; g.font=font(400,15); g.fillText(anaMsg,W/2,H/2+10);
  for(let i=0;i<12;i++){ const a=menuT*3+i*.52; g.fillStyle=`hsl(${i*30},100%,65%)`; g.globalAlpha=(i/12); g.fillRect(W/2-90+i*15,H/2+50-Math.abs(Math.sin(a))*30,8,Math.abs(Math.sin(a))*30+4); } g.globalAlpha=1; }

// ================================================================ loop
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now; menuT+=dt; flashT=Math.max(0,flashT-dt);
  try{
    if(state==='play'){ updateGame(dt); drawGame(dt); }
    else if(state==='pause'){ drawGame(0); drawPause(); }
    else if(state==='results'){ drawGame(0); drawResults(); }
    else { const pulse=(Math.sin(menuT*Math.PI*2*1.6)+1)/2*.4; drawBG(dt,W,state!=='analyze',pulse,menuT);
      if(state==='title') drawTitle(); else if(state==='select') drawSelect(); else if(state==='genre'){ drawSelect(); drawGenre(); } else if(state==='analyze') drawAnalyze(); }
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
